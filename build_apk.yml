name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -q otaku_world.zip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform files
        working-directory: otaku_world
        run: |
          flutter create --platforms=android --org com.otakuworld --project-name otaku_world .
          sed -i 's/android:label="[^"]*"/android:label="OTAKU WORLD"/' android/app/src/main/AndroidManifest.xml

      - name: Get packages
        working-directory: otaku_world
        run: flutter pub get

      - name: Build release APK
        working-directory: otaku_world
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: otaku-world-apk
          path: otaku_world/build/app/outputs/flutter-apk/app-release.apk
